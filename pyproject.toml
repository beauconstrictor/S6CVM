[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "s6cvm"
version = "0.1.0"
description = "forth compiler for ozpex s6"
requires-python = ">=3.12"

# [project.scripts]
# s6cvm = "s6cvm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# TODO: future me!
s6asm = ["stdlib/*.4th"]

[tool.ruff.lint]
ignore = ["I"]

[tool.basedpyright]
reportUnusedCallResult = "none"
